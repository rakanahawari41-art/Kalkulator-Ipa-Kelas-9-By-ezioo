<!doctype html>
<html lang="id">
<head>

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Konsep: buku catatan lab di atas kertas milimeter. Hasil tampil di layar LCD ala multimeter; tiap topik punya warna sendiri. */
:root{
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#EDF2F1; --grid:rgba(18,70,62,.07);
  --surface:#FFFFFF; --surface-2:#F4F7F6;
  --fg:#12201E; --muted:#51666A; --line:#D3DDDB;
  --accent:#0E5A6B; --on-accent:#FFFFFF;
  --warn:#B3261E; --ok:#1B7F4B;
  --c-statis:#6B4FD3; --c-dinamis:#A85F00; --c-magnet:#C23B4E; --c-gen:#23834F; --c-alat:#2F6DA3;
  --lcd-bg:#10201C; --lcd-fg:#8FF0C0; --lcd-dim:#6FA892; --lcd-edge:#2B4A41;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1615; --grid:rgba(150,220,205,.05);
  --surface:#15211F; --surface-2:#1B2927;
  --fg:#E6EFED; --muted:#9DB0AD; --line:#2A3B38;
  --accent:#5CC4D6; --on-accent:#04252C;
  --warn:#FF8A80; --ok:#6FD39A;
  --c-statis:#A99BF6; --c-dinamis:#F0B34A; --c-magnet:#F27A8B; --c-gen:#6FD39A; --c-alat:#7DB6EA;
  --lcd-bg:#07110F; --lcd-fg:#9CF7C9; --lcd-dim:#6FA892; --lcd-edge:#1F3A33;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1615; --grid:rgba(150,220,205,.05);
  --surface:#15211F; --surface-2:#1B2927;
  --fg:#E6EFED; --muted:#9DB0AD; --line:#2A3B38;
  --accent:#5CC4D6; --on-accent:#04252C;
  --warn:#FF8A80; --ok:#6FD39A;
  --c-statis:#A99BF6; --c-dinamis:#F0B34A; --c-magnet:#F27A8B; --c-gen:#6FD39A; --c-alat:#7DB6EA;
  --lcd-bg:#07110F; --lcd-fg:#9CF7C9; --lcd-dim:#6FA892; --lcd-edge:#1F3A33;
  color-scheme:dark}

*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:12px 100px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#app{max-width:640px;margin:0 auto}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.g-statis{--c:var(--c-statis)}.g-dinamis{--c:var(--c-dinamis)}.g-magnet{--c:var(--c-magnet)}.g-gen{--c:var(--c-gen)}.g-alat{--c:var(--c-alat)}

.eyebrow{font:500 11px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tg{color:var(--c)}
.title{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,11vw,58px);line-height:.96;letter-spacing:-.025em;margin:10px 0 10px;text-wrap:balance}
.ctitle{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8vw,40px);line-height:1;letter-spacing:-.02em;margin:8px 0 8px;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:52ch}
h2,h3,h4{text-wrap:balance}
.hero{padding-top:14px}
.back{display:inline-block;color:var(--muted);text-decoration:none;font-weight:500;padding:10px 0 4px}
.formula{display:inline-block;margin-top:12px;font:500 16px/1.4 var(--f-mono);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;overflow-wrap:anywhere}

.searchrow{margin-top:18px}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0;max-width:100%}
input[type=search]{width:100%;background:var(--surface);padding:12px 14px;border-radius:10px}
input[type=text]{font-family:var(--f-mono)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:6px 0 0}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

.group{margin-top:24px}
.group-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 8px}
.group-h h2{font:700 20px/1.2 var(--f-display);margin:0}
.group-h span{font:12px var(--f-mono);color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;color:inherit;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.tile{flex:none;width:48px;height:48px;border-radius:10px;display:grid;place-items:center;font:600 14px var(--f-mono);color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.row .t{min-width:0;flex:1}
.row .name{font-weight:600;display:block}
.row .fm{font:12.5px/1.4 var(--f-mono);color:var(--muted);overflow-wrap:anywhere;display:block}
.chev{color:var(--muted);font-size:22px}

.inp input{flex:1;min-width:0}
.inp select{flex:none;max-width:42%}
.unit-static{font:13px var(--f-mono);color:var(--muted);padding:0 4px;white-space:nowrap}
.hint{font-size:13px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 14px;font:600 15px var(--f-mono);min-width:48px}
.seg button[aria-pressed=true]{background:var(--c,var(--accent));color:var(--surface);border-color:var(--c,var(--accent))}
[data-presets]{margin-bottom:14px}

.lrow{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;background:var(--surface-2)}
.lhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lhead strong{font:600 14px var(--f-mono)}
.lcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.lcol{display:grid;gap:4px;min-width:0}
.lcol.wide{grid-column:1/-1}
.lcol .lbl{font-size:11px}
.lcol input,.lcol select{background:var(--surface)}
.btn{font-weight:600;font-size:14px;border-radius:10px;padding:10px 14px;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.addbtn{margin-top:8px;width:100%;border-style:dashed}

.lcd{margin-top:14px;background:var(--lcd-bg);color:var(--lcd-fg);border:1px solid var(--lcd-edge);border-radius:12px;padding:14px 16px 14px;box-shadow:inset 0 2px 14px rgba(0,0,0,.5)}

.kv div{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}

.sx{margin-top:10px}
.sx:first-of-type{margin-top:0}

.scroll{overflow-x:auto}

.punnett th{background:var(--surface-2);color:var(--fg)}
.ph0{background:color-mix(in srgb,var(--c-gen) 20%,var(--surface))}
.ph1{background:color-mix(in srgb,var(--c-dinamis) 22%,var(--surface))}
.ph2{background:color-mix(in srgb,var(--c-alat) 22%,var(--surface))}
.ph3{background:color-mix(in srgb,var(--c-magnet) 20%,var(--surface))}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);margin-right:6px;vertical-align:-1px}

.q{font-size:17px;line-height:1.5;margin:8px 0 14px}
.fb{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:14px;border:1px solid var(--line);background:var(--surface-2)}
.fb.ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--line));background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.fb.bad{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.score{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.score div{flex:1;min-width:90px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.score b{display:block;font:600 22px var(--f-mono)}
.score span{font-size:12px;color:var(--muted)}
.fi{padding:12px 0;border-top:1px solid var(--line)}
.fi:first-child{border-top:0}
.fi .nm{font-weight:600}
.fi .fx{font:500 16px/1.4 var(--f-mono);margin:2px 0;overflow-wrap:anywhere}
.fi .nt{font-size:13px;color:var(--muted)}
.fi a{font-size:13px;font-weight:600;color:var(--accent)}
.hi{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.hi:first-child{border-top:0}
.hi .t{flex:1;min-width:0}
.hi .name{font-weight:600}
.hi .sm{font:13.5px var(--f-mono);overflow-wrap:anywhere}
.hi .dt{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end;margin-top:14px}
.two .field{margin-top:0}
.two select{width:100%;max-width:none}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav a{display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:500}
nav a[aria-current=page]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
@media (prefers-reduced-motion:no-preference){.lcd .val{transition:color .2s}}
</style>

<script>
/* ========== Utilitas ========== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUPM={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
const SUBM=['₀','₁','₂','₃','₄','₅','₆','₇','₈','₉'];
const sup=n=>String(n).split('').map(c=>SUPM[c]||c).join('');
const sub=n=>String(n).split('').map(c=>SUBM[+c]||c).join('');
const thou=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
function fmt(x,sig){
  sig=sig||4;
  if(typeof x!=='number'||!isFinite(x)) return '—';
  if(x===0) return '0';
  const ax=Math.abs(x);
  if(ax>=1e-3&&ax<1e6){
    const str=String(Number(x.toPrecision(sig)));
    const neg=str[0]==='-';
    const parts=(neg?str.slice(1):str).split('.');
    return (neg?'-':'')+thou(parts[0])+(parts[1]?','+parts[1]:'');
  }
  let e=Math.floor(Math.log10(ax)), m=x/Math.pow(10,e);
  while(Math.abs(m)<1){m*=10;e--;}
  let ms=Number(m.toPrecision(sig));
  if(Math.abs(ms)>=10){ms=Number((ms/10).toPrecision(sig));e++;}
  return String(ms).replace('.',',')+' × 10'+sup(e);
}
function parseNum(s){
  if(s==null) return NaN;
  s=String(s).trim().toLowerCase().replace(/\s/g,'').replace(/×/g,'x').replace(',','.');
  if(s==='') return NaN;
  s=s.replace(/[x*]10\^?/,'e').replace('^','');
  if(!/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}
const need=(c,m)=>{if(!c) throw new Error(m);};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const rupiah=x=>'Rp '+String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
function ratio(counts){
  const nz=counts.filter(c=>c>0); if(!nz.length) return [];
  const g=nz.reduce((a,b)=>gcd(a,b));
  return counts.map(c=>c/g);
}
function tableHTML(head,rows,numFrom){
  numFrom=numFrom==null?99:numFrom;
  return '<div class="scroll"><table><thead><tr>'+head.map((h,i)=>`<th class="${i>=numFrom?'n':''}">${esc(h)}</th>`).join('')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr>'+r.map((c,i)=>`<td class="${i>=numFrom?'n':''}">${esc(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>';
}

/* ========== Satuan ========== */
const U={
  C:[['C',1],['mC',1e-3],['µC',1e-6],['nC',1e-9]],
  N:[['N',1],['mN',1e-3],['kN',1e3]],
  m:[['m',1],['cm',1e-2],['mm',1e-3],['km',1e3]],
  V:[['V',1],['mV',1e-3],['kV',1e3]],
  I:[['A',1],['mA',1e-3],['µA',1e-6]],
  R:[['Ω',1],['kΩ',1e3],['MΩ',1e6],['mΩ',1e-3]],
  W:[['W',1],['kW',1e3],['mW',1e-3]],
  J:[['J',1],['kJ',1e3],['Wh',3600],['kWh',3.6e6]],
  t:[['s',1],['menit',60],['jam',3600],['hari',86400]],
  T:[['T',1],['mT',1e-3],['µT',1e-6]],
  E:[['N/C',1],['kN/C',1e3]],
  Wb:[['Wb',1],['mWb',1e-3]],
  none:[['',1]]
};
const K=9e9, ECH=1.6e-19, MU0=4*Math.PI*1e-7;

/* relasi A = B × C; target salah satunya */
function mulRel(s,A,B,C,abs){
  const v=k=>abs&&abs.includes(k)?Math.abs(s.v[k]):s.v[k];
  let val,j;
  if(s.target===A.k){
    val=v(B.k)*v(C.k);
    j=[`${A.sym} = ${B.sym} × ${C.sym}`,`${A.sym} = ${fmt(v(B.k))} × ${fmt(v(C.k))}`];
  }else{
    const T=s.target===B.k?B:C, O=s.target===B.k?C:B;
    need(v(O.k)!==0,`${O.sym} tidak boleh 0.`);
    val=v(A.k)/v(O.k);
    j=[`${T.sym} = ${A.sym} / ${O.sym}`,`${T.sym} = ${fmt(v(A.k))} / ${fmt(v(O.k))}`];
  }
  const T=[A,B,C].find(x=>x.k===s.target);
  j.push(`${T.sym} = ${fmt(val)} ${T.u}`);
  return {value:val,jawab:j};
}

/* ========== Golongan topik ========== */
const GROUPS={
  statis:{n:'Listrik Statis',d:'Muatan, gaya, dan medan listrik'},
  dinamis:{n:'Listrik Dinamis',d:'Arus, hambatan, daya, dan tagihan'},

function readState(calc){
  const s={target:cur.target,v:{},raw:{},uidx:{},sel:{},text:{},lists:{}};
  calc.fields.forEach(f=>{if(f.type==='select')s.sel[f.k]=$('#f-'+f.k).value;else if(f.type==='text')s.text[f.k]=$('#f-'+f.k).value;});
  calc.fields.forEach(f=>{
    if(f.type==='select'||f.type==='text') return;
    if(f.type==='list'){
      s.lists[f.k]=$$(`[data-list="${f.k}"] [data-row]`).map(r=>{
        const o={};
        f.cols.forEach(c=>{
          const el=r.querySelector(`[data-c="${c.k}"]`);
          if(c.type==='text'){o[c.k]=el.value.trim();return;}
          const ui=+((r.querySelector(`[data-cu="${c.k}"]`)||{}).value||0),us=c.units||U.none;
          o[c.k]=parseNum(el.value)*us[ui][1];
        });
        return o;
      });
      return;
    }
    const us=f.units||U.none,ui=+(($('#u-'+f.k)||{}).value||f.u||0);
    s.raw[f.k]=$('#f-'+f.k).value.trim();s.uidx[f.k]=ui;
    s.v[f.k]=parseNum(s.raw[f.k])*us[ui][1];
  });
  return s;
}
function missing(calc,s){
  for(const f of calc.fields){
    if(!isVisible(f,s)) continue;
    if(f.type==='select') continue;
    if(f.type==='text'){continue;}
    if(f.type==='list'){
      const rows=s.lists[f.k];
      for(const r of rows){for(const c of f.cols){if(c.type!=='text'&&!Number.isFinite(r[c.k])) return `Isi semua kolom angka pada “${f.label}”.`;}}
      continue;
    }
    if(!f.opt&&!Number.isFinite(s.v[f.k])) return `Isi kolom “${f.label}” dengan angka. Gunakan koma untuk desimal, mis. 2,5 atau 2e-6.`;
  }
  return null;
}
function mainOf(calc,s,res){
  if(res.main) return res.main;
  const f=fld(calc,s.target);
  return {sym:f.sym,units:f.units||U.none,value:res.value,outU:f.outU};
}
function shown(m,key){
  if(m.display!=null) return {text:m.display,unit:''};
  const us=m.units||U.none;
  let i=stOut[key];if(i==null||i>=us.length) i=m.outU!=null?m.outU:siIdx(us);
  return {text:fmt(m.value/us[i][1]),unit:us[i][0],idx:i,us};
}
function buildSteps(calc,s,res){
  const dk=[];
  calc.fields.forEach(f=>{
    if(!isVisible(f,s)||f.type) return;
    const si=s.v[f.k];if(!Number.isFinite(si)) return;
    const us=f.units||U.none,u=us[s.uidx[f.k]||0],siU=us[siIdx(us)][0];
    let line=`${f.sym} = ${s.raw[f.k]}${u[0]?' '+u[0]:''}`;
    if(u[1]!==1) line+=` = ${fmt(si)} ${siU}`;
    dk.push(line);
  });
  (res.dk||[]).forEach(x=>dk.push(x));
  (calc.consts||[]).forEach(x=>dk.push(x));
  let dt=res.ditanya;
  if(!dt){const f=s.target?fld(calc,s.target):null;dt=f?f.label:'Hasil';}
  return {dk,dt,jw:res.jawab||[]};
}
function summaryText(calc,s,res){
  if(res.summary) return res.summary;
  const m=mainOf(calc,s,res),sh=shown(m,calc.id+':'+s.target);
  return `${m.sym} = ${sh.text}${sh.unit?' '+sh.unit:''}`;
}
function renderResult(){
  const box=$('#result');if(!box||!cur||!cur.calc) return;
  const {calc,s,res}=cur;let err=cur.err;
  if(!err&&res&&res.value!==undefined&&!Number.isFinite(res.value)) err='Hasil tidak bisa dihitung dari angka ini. Periksa kembali isiannya.';
  if(err){
    box.innerHTML=`<div class="lcd err" aria-live="polite"><div class="cap">Hasil</div><div class="val">— — —</div></div><div class="msg" role="status">${esc(err)}</div>`;
    return;
  }
  const m=mainOf(calc,s,res),key=calc.id+':'+s.target,sh=shown(m,key);
  const chips=sh.us&&sh.us.length>1?`<div class="units" role="group" aria-label="Satuan hasil">${sh.us.map((u,i)=>`<button type="button" data-act="unit" data-i="${i}" aria-pressed="${i===sh.idx}">${esc(u[0])}</button>`).join('')}</div>`:'';
  let h=`<div class="lcd" aria-live="polite"><div class="cap">Hasil · ${esc(m.sym)}</div><div class="val">${esc(sh.text)}${sh.unit?`<span class="u"> ${esc(sh.unit)}</span>`:''}</div>${m.sub?`<div class="sub">${esc(m.sub)}</div>`:''}${chips}</div>`;
  if(res.extras&&res.extras.length) h+=`<section class="panel"><dl class="kv">${res.extras.map(x=>`<div><dt>${esc(x.l)}</dt><dd>${esc(x.t)}</dd></div>`).join('')}</dl></section>`;
  (res.blocks||[]).forEach(b=>{h+=`<section class="panel"><h3>${esc(b.h)}</h3>${b.html}</section>`;});
  const st=buildSteps(calc,s,res);
  h+=`<section class="panel"><h3>Cara pengerjaan</h3>
   <div class="sx"><h4>Diketahui</h4>${st.dk.map(x=>`<div class="ln">${esc(x)}</div>`).join('')||'<div class="ln">—</div>'}</div>
   <div class="sx"><h4>Ditanya</h4><div class="ln">${esc(st.dt)}</div></div>
   <div class="sx"><h4>Jawab</h4>${st.jw.map((x,i)=>`<div class="ln${i===st.jw.length-1?' last':''}">${esc(x)}</div>`).join('')}</div></section>
   <div class="actions"><button type="button" class="btn primary" data-act="save">Simpan ke riwayat</button><button type="button" class="btn" data-act="copy">Salin hasil</button></div><div class="hint" id="fb" role="status" style="margin-top:8px"></div>`;
  box.innerHTML=h;
}
function update(){
  if(!cur||!cur.calc) return;
  const calc=cur.calc,s=readState(calc);cur.s=s;
  calc.fields.forEach(f=>{const w=$(`#calc [data-k="${f.k}"]`);if(w) w.hidden=!isVisible(f,s);});
  const pw=$('#calc [data-presets]');if(pw) pw.hidden=calc.presetWhen?!calc.presetWhen(s):false;
  cur.err=missing(calc,s);cur.res=null;
  if(!cur.err){try{cur.res=calc.compute(s);}catch(e){cur.err=e.message||'Terjadi kesalahan.';}}
  renderResult();
}
function syncTarget(){$$('#calc [data-act="target"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===cur.target)));}
function snapshot(calc){
  const o={target:cur.target,f:{},sel:{},text:{},lists:{}};
  calc.fields.forEach(f=>{
    if(f.type==='select') o.sel[f.k]=$('#f-'+f.k).value;
    else if(f.type==='text') o.text[f.k]=$('#f-'+f.k).value;
    else if(f.type==='list') o.lists[f.k]=$$(`[data-list="${f.k}"] [data-row]`).map(r=>{const c={};f.cols.forEach(cl=>{c[cl.k]={v:r.querySelector(`[data-c="${cl.k}"]`).value,u:+((r.querySelector(`[data-cu="${cl.k}"]`)||{}).value||0)};});return c;});
    else o.f[f.k]={v:$('#f-'+f.k).value,u:+(($('#u-'+f.k)||{}).value||0)};
  });
  return o;
}
function applySnap(calc,o){
  calc.fields.forEach(f=>{
    if(f.type==='select'){if(o.sel&&o.sel[f.k]!=null)$('#f-'+f.k).value=o.sel[f.k];}
    else if(f.type==='text'){if(o.text&&o.text[f.k]!=null)$('#f-'+f.k).value=o.text[f.k];}
    else if(f.type==='list'){if(o.lists&&o.lists[f.k]){$(`[data-list="${f.k}"]`).innerHTML=o.lists[f.k].map((r,i)=>rowHTML(f,i,r)).join('');}}
    else if(o.f&&o.f[f.k]){$('#f-'+f.k).value=o.f[f.k].v;const u=$('#u-'+f.k);if(u)u.value=o.f[f.k].u;}
  });
}
function applyPreset(calc,p){
  Object.keys(p.set).forEach(k=>{
    const f=fld(calc,k),val=p.set[k];if(!f) return;
    if(f.type==='select'||f.type==='text') $('#f-'+k).value=val;
    else if(typeof val==='object'){$('#f-'+k).value=val.v;const u=$('#u-'+k);if(u)u.value=val.u;}
    else $('#f-'+k).value=val;
  });
}
function listHint(k,msg){const el=$(`[data-lh="${k}"]`);if(el)el.textContent=msg||'';}
function relabel(f){$$(`[data-list="${f.k}"] [data-row]`).forEach((r,i)=>{r.querySelector('.rl').textContent=f.rowLabel(i);});}

function copyText(text){
  const fb=$('#fb');
  const manual=()=>{if(!fb)return;fb.innerHTML='Salin manual dari kotak ini:<textarea readonly rows="6" style="width:100%;margin-top:6px;font:13px var(--f-mono);background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px"></textarea>';const t=fb.querySelector('textarea');t.value=text;t.focus();t.select();};
  try{navigator.clipboard.writeText(text).then(()=>{if(fb)fb.textContent='Hasil disalin.';},manual);}catch(e){manual();}
}
function handleInput(e){
  const t=e.target;
  if(t.id==='q-search'){homeQ=t.value;drawList();return;}
  if(t.id==='r-search'){drawFormulas();return;}
  if(t.closest&&t.closest('#cv')){if(t.id==='cv-cat')convFill();convUpdate();return;}
  if(t.id==='p-topic'){P.topic=t.value;newQ();drawPractice();return;}
  if(cur&&cur.calc&&t.closest('#calc')) update();
}
app.addEventListener('input',handleInput);
app.addEventListener('change',handleInput);
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='p-ans'){e.preventDefault();pCheck();}});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b) return;
  const act=b.dataset.act;
  if(act==='topic'){homeG=b.dataset.g;drawChips();drawList();}
  else if(act==='target'){cur.target=b.dataset.t;syncTarget();update();}
  else if(act==='preset'){applyPreset(cur.calc,cur.calc.presets[+b.dataset.i]);update();}
  else if(act==='unit'){const key=cur.calc.id+':'+cur.s.target;stOut[key]=+b.dataset.i;renderResult();}
  else if(act==='add'){
    const f=fld(cur.calc,b.dataset.k),box=$(`[data-list="${f.k}"]`),rows=$$('[data-row]',box);
    if(rows.length>=f.max){listHint(f.k,`Maksimal ${f.max} baris.`);return;}
    const last=rows[rows.length-1],row={};
    if(last)f.cols.forEach(c=>{row[c.k]={v:c.type==='text'?'':last.querySelector(`[data-c="${c.k}"]`).value,u:+((last.querySelector(`[data-cu="${c.k}"]`)||{}).value||0)};});
    box.insertAdjacentHTML('beforeend',rowHTML(f,rows.length,row));listHint(f.k,'');update();
  }
  else if(act==='del'){
    const f=fld(cur.calc,b.dataset.k),box=$(`[data-list="${f.k}"]`),rows=$$('[data-row]',box);
    if(rows.length<=f.min){listHint(f.k,`Minimal ${f.min} baris.`);return;}
    b.closest('[data-row]').remove();relabel(f);listHint(f.k,'');update();
  }
  else if(act==='save'){
    const it={id:cur.calc.id,t:Date.now(),snap:snapshot(cur.calc),sum:summaryText(cur.calc,cur.s,cur.res)};
    saveH([it,...loadH()].slice(0,40));$('#fb').textContent='Tersimpan di Riwayat.';
  }
  else if(act==='copy'){
    const st=buildSteps(cur.calc,cur.s,cur.res);
    copyText([cur.calc.title,'','Diketahui:',...st.dk.map(x=>'  '+x),'Ditanya: '+st.dt,'Jawab:',...st.jw.map(x=>'  '+x)].join('\n'));
  }
  else if(act==='swap'){const a=$('#cv-from'),c=$('#cv-to'),v=a.value;a.value=c.value;c.value=v;convUpdate();}
  else if(act==='p-new'){newQ();drawPractice();}
  else if(act==='p-check') pCheck();
  else if(act==='p-show') pShow();
  else if(act==='h-open'){const it=loadH()[+b.dataset.i];if(it){pendingSnap={id:it.id,snap:it.snap};location.hash='#k-'+it.id;}}
  else if(act==='h-del'){const a=loadH();a.splice(+b.dataset.i,1);saveH(a);drawHistory();}
  else if(act==='h-clear'){clearAsk=true;drawHistory();}
  else if(act==='h-clear-no'){clearAsk=false;drawHistory();}
  else if(act==='h-clear-yes'){saveH([]);clearAsk=false;drawHistory();}
});
route();
</script>
</body>
</html>
